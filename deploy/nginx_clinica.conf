# NÃO USADO: a VPS roda os sistemas com Docker + Caddy. Pode apagar este arquivo.
# /etc/nginx/sites-available/clinica.cortio.com.br
# Só responde pelo subdomínio da clínica; não interfere nos outros sistemas.
server {
    listen 80;
    server_name clinica.cortio.com.br;

    client_max_body_size 10M;

    location /static/ {
        alias /srv/saude_agora/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/saude_agora/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/saude_agora/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
